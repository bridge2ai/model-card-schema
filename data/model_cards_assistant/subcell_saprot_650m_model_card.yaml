schema_version: "0.0.2"

model_details:
  name: "SaProtHub SubCell Localization 650M (LoRA-fine-tuned SaProt)"
  short_description: "Protein-level classifier predicting one of ten subcellular localization labels from structure-aware protein sequences using a LoRA-adapted SaProt 650M model."
  overview: |
    This card describes the public SaProtHub/Model-Subcellular_Localization-650M adapter,
    with base model westlake-repl/SaProt_650M_AF2. It does not establish that this checkpoint
    is a CM4AI-trained model or that it has been validated on CM4AI data.

    The upstream model README reports 85.75% test accuracy on the linked SaProtHub DeepLoc
    dataset. This is an author-reported result, not an independently reproduced measurement.
    The dataset describes a ten-class, single-label task derived from the original 2017
    DeepLoc dataset, using AlphaFold2 structure-aware sequences. It is not identified as
    DeepLoc 2.0. The audited dataset snapshot contains validation/test sequence overlap;
    see the evaluation procedure for the finding and its provenance limits.
  documentation: |
    Evidence reviewed on 2026-09-28: model repository revision
    ffc656cde0bbfaf4933b364036753674520663b6 and dataset revision
    78096a0eff765cf8988323ca3c21c0f19ca1ae79. These identify the inspected artifacts;
    the model README does not bind its score to that dataset revision or a training run.

    The pinned model repository distributes adapter_model.bin (55,417,357 bytes), a
    PyTorch/PEFT .bin weight checkpoint, together with adapter_config.json. The upstream
    loader reads this format with torch.load. It contains the LoRA adapter and saved
    classifier as specified by the adapter configuration; inference also requires
    westlake-repl/SaProt_650M_AF2 base weights. The file listing and loader were inspected,
    but the weight file was not downloaded. adapter_config.json specifies SEQ_CLS,
    rank 16, alpha 32, dropout 0,
    attention query/key/value and feedforward intermediate.dense/output.dense targets,
    and modules_to_save=[classifier]. Its base-model revision is null, so the exact base
    checkpoint used for training remains unresolved.

    Use the official ColabSaprot workflow described in usage_documentation. The previous
    saprot_hub.load_model(...).predict(...) example was not grounded in the inspected
    upstream API and has been removed. Current upstream software documentation is usage
    guidance; it is not evidence of the historical environment of this adapter's run.
