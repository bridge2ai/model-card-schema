usage_documentation:
  installation_instructions: |
    The supported entry point is the official ColabSaprot notebook:
    https://colab.research.google.com/github/westlake-repl/SaprotHub/blob/3661c549ec48efc5a480e5e941a204e807b2e68a/colab/SaprotHub_v2.ipynb
    Follow its environment setup. For a local runtime, follow the upstream installation guide:
    https://github.com/westlake-repl/SaprotHub/blob/3661c549ec48efc5a480e5e941a204e807b2e68a/local_server/README.md
    This card does not assert that the current notebook's dependencies reproduce the
    original adapter training environment. No model weights were downloaded or inference
    executed during this documentation review.
  training_configuration: |
    The checkpoint README reports AdamW with learning rate 0.0005, betas (0.9, 0.98),
    weight decay 0.01, batch size 64, 100 epochs and 16-mixed precision. Use rank 16,
    alpha 32 and dropout 0 for its documented LoRA configuration. This is a partial
    recipe: obtain the original random seed, base revision, training-code commit,
    environment lockfile, preprocessing settings, split manifest and checkpoint-selection
    log before claiming reproduction of the 85.75% result.
  inference_configuration: |
    In ColabSaprot v2 choose the existing-model prediction workflow, then Protein property
    prediction. Select Protein-level Classification, set Number of categories to 10,
    choose Shared by peers on SaprotHub, and enter
    SaProtHub/Model-Subcellular_Localization-650M. For this SA-trained adapter, select
    protein structure and supply a PDB/CIF file with the intended chain. The notebook
    converts structures to the SA representation and exports a prediction CSV.

    Decode predicted_label using the exact 0-9 mapping in output_format_map. The notebook's
    predicted_probabilities column contains softmax scores; calibration and abstention
    thresholds are not established for this checkpoint. Its UI loads repository defaults;
    record the resolved model, base and software revisions for any new analysis. A pinned
    notebook alone does not pin its remote model downloads or installation dependencies.
  code_examples:
    - description: "Decode the notebook's exported predicted_label column into compartment names; this postprocessing example does not perform inference."
      code_language: "python"
      code: |
        import csv
        import sys

        labels = [
            "Nucleus", "Cytoplasm", "Extracellular", "Mitochondrion",
            "Cell.membrane", "Endoplasmic.reticulum", "Plastid",
            "Golgi.apparatus", "Lysosome/Vacuole", "Peroxisome",
        ]
        # Run: python decode_labels.py path/to/colabsaprot_output.csv
        with open(sys.argv[1], newline="") as handle:
            reader = csv.DictReader(handle)
            if "predicted_label" not in (reader.fieldnames or []):
                raise ValueError("Expected ColabSaprot's predicted_label column")
            for row_number, row in enumerate(reader, start=1):
                label = int(row["predicted_label"])
                if not 0 <= label < len(labels):
                    raise ValueError(f"Invalid class label in row {row_number}: {label}")
                print(row_number, label, labels[label], sep="\t")

considerations:
  users:
    - description: "Researchers studying protein localization and evaluating structure-aware protein classifiers."
  use_cases:
    - description: "Research screening of protein subcellular localization from structure-aware inputs, followed by independent validation."
    - description: "Evaluation of this public adapter against a documented, independently checked split and its fixed ten-class label mapping."
  limitations:
    - description: |
        The checkpoint is single-label: it returns one of ten categories and cannot
        represent multiple simultaneous localizations through its documented label output.
    - description: |
        The model is trained on SA inputs. Generic SaProt software supports amino-acid-only
        modes, but the reported score does not establish this adapter's performance without
        structural information; the current ColabSaprot workflow enforces structure input
        for adapters marked SA.
    - description: |
        Exact preprocessing, long-protein truncation settings and structural-confidence
        handling for the scored run are not bound to this artifact. Current upstream
        defaults should not be presented as the historical run's settings.
    - description: |
        The score lacks a bound evaluation manifest, per-class metrics, calibration,
        confidence intervals and repeated-seed results. The observed current-mirror split
        overlap must be resolved before treating validation and test data as independent.
    - description: |
        Validation on CM4AI data, species-specific generalization and performance on
        underrepresented compartments remain unestablished by the inspected artifacts.
  tradeoffs:
    - description: "LoRA permits distribution of the adapter and classifier, but inference still requires the 650M base model and structure-aware preprocessing. No measured compute or latency comparison is supplied for this checkpoint."
    - description: "Curator recommendation: when comparing or selecting localization models, assess per-compartment recall and macro-F1 alongside aggregate accuracy. The observed class imbalance means frequent compartments contribute more to overall accuracy; prioritizing rare-compartment recall may produce a different model choice. This is a metric-selection tradeoff, not evidence that this adapter under-predicts rare compartments."
  ethical_considerations:
    - name: "Incorrect localization used as biological evidence"
      mitigation_strategy: "Curator recommendation: treat predictions as research hypotheses and validate with appropriate experimental localization evidence before downstream biological decisions."
  out_of_scope_uses:
    - description: "Curator-defined scope: standalone clinical diagnosis or therapeutic decisions without task-specific clinical validation."
    - description: "Claims of CM4AI-specific performance, multi-label localization or calibrated confidence without corresponding validation data."

bias_model: |
  Observed documentation and dataset limitations: the AF2-availability filter and uneven
  training label counts can affect the populations and compartments represented. Species
  and family composition, and their effects on model performance, are not established
  by the inspected CSV and model README.
bias_output: |
  Per-class output bias has not been measured in the supplied artifacts. The training
  label imbalance alone does not establish under-prediction of any compartment;
  per-example predictions and class-level precision/recall are needed to assess it.
