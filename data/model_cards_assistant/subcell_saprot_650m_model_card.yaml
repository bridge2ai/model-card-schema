model_parameters:
  model_architecture: |
    SaProt_650M_AF2 is the approximately 650M-parameter, ESM-style transformer base
    using a structure-aware amino-acid/3Di vocabulary. The adapter config names that
    base and LoRA SEQ_CLS adaptation, with rank 16, alpha 32 and dropout 0, targeting
    query, key, value, intermediate.dense and output.dense. The classifier is saved
    with the adapter. The upstream classification implementation uses an ESM sequence
    classification model producing ten logits; the adapter weights were not loaded
    or independently inspected during this documentation revision.
  data:
    - name: "SaProtHub DeepLoc subcellular localization dataset"
      link: "https://huggingface.co/datasets/SaProtHub/Dataset-Subcellular_Localization-DeepLoc/tree/78096a0eff765cf8988323ca3c21c0f19ca1ae79"
      description: |
        The publisher links the original 2017 DeepLoc publication. Its README says proteins
        lacking AlphaFold2 structures were excluded and describes a split based on 70%
        structure similarity using ProteinShake. CSV revision
        78096a0eff765cf8988323ca3c21c0f19ca1ae79 contains 13,150 rows with columns protein,
        label and stage: 10,414 train, 1,368 valid and 1,368 test. These counts were checked
        directly on the published CSV. The stage column defines subsets within one file;
        the Hugging Face dataset config is named dataset.

        The model's reported score is not explicitly bound to this CSV revision. An exact
        string audit finds 232 unique SA sequences shared by valid and test, and one
        AA-only sequence shared by train and test. This needs investigation against the
        original scored split manifest before asserting evaluation independence.
      unit: "protein sequence record"
      sensitive:
        sensitive_data:
          - "The inspected CSV has protein, label and stage columns; it has no individual-level demographic or clinical metadata columns."
      bias_input: |
        The publisher's AF2-availability filter limits coverage to proteins with available
        structures. Observed training class counts in label order 0-9 are
        [2641, 1913, 1498, 1323, 979, 745, 633, 282, 268, 132]. Species and protein-family
        identifiers are not present in the inspected CSV, so their distributions cannot
        be established from this artifact alone.
  input_format: "Structure-aware (SA) sequence: each amino-acid letter is paired with a Foldseek 3Di structural token; # denotes a masked structural token."
  input_format_map:
    - key: "type"
      value: "string"
    - key: "encoding"
      value: "One uppercase amino-acid letter followed by one lowercase structural letter or # per residue; for example M#Ev."
    - key: "length_handling"
      value: "The current upstream classification dataset implementation defaults to 1024 residue/SA tokens and truncates longer inputs. The trained adapter's exact preprocessing limit is not recorded in its README."
  output_format: "Ten class logits per protein; argmax produces a single integer label 0-9. ColabSaprot exports predicted_label and softmax predicted_probabilities."
  output_format_map:
    - key: "logits_shape"
      value: "[batch_size, 10]"
    - key: "label_mapping"
      value: "0=Nucleus; 1=Cytoplasm; 2=Extracellular; 3=Mitochondrion; 4=Cell.membrane; 5=Endoplasmic.reticulum; 6=Plastid; 7=Golgi.apparatus; 8=Lysosome/Vacuole; 9=Peroxisome"
    - key: "interpretation"
      value: "A single-label prediction; softmax values are not documented as calibrated probabilities."
  training_procedure:
    description: |
      The model README reports LoRA fine-tuning of SaProt_650M_AF2 on the linked DeepLoc
      mirror with the classifier saved alongside the adapter. The reported configuration
      is transcribed below; a completed training log was not supplied by these artifacts.
    methodology: |
      LoRA adapts attention and feedforward projections while retaining the pretrained
      backbone; the classifier is included in modules_to_save. The linked upstream
      classification implementation uses cross-entropy and selects saved checkpoints
      using validation accuracy. That implementation was inspected at SaprotHub revision
      3661c549ec48efc5a480e5e941a204e807b2e68a; it does not identify the code revision,
      checkpoint-selection decision or number of completed epochs for the historical run.
    pre_training_info: |
      The official SaProt README describes the SaProt_650M_AF2 base as pretrained on
      40 million AlphaFold2 structures. This is base-model pretraining provenance, not
      the size of the localization fine-tuning dataset.
    reproducibility_info:
      hyperparameters:
        model_initialization: "Pretrained westlake-repl/SaProt_650M_AF2; adapter_config.json leaves the base revision unspecified."
        optimizer: "AdamW; betas=(0.9, 0.98); weight_decay=0.01 (model README)"
        learning_rate: 0.0005
        batch_size: 64
        training_epochs: 100
        fine_tuning_method: "LoRA (SEQ_CLS), with classifier in modules_to_save"
        optimization_techniques:
          - "LoRA rank=16, alpha=32, dropout=0"
          - "Targets: query, key, value, intermediate.dense, output.dense"
          - "16-mixed precision (reported configuration)"

quantitative_analysis:
  performance_metrics:
    - type: "test accuracy (author-reported)"
      value: 85.75
      slice: "SaProtHub DeepLoc test set; exact scored dataset revision and run are unspecified"
      unit: "%"
  evaluation_procedure:
    description: |
      The model README reports 85.75% accuracy on the linked dataset's test set. For a
      single-label task, accuracy is the fraction of predictions whose highest-scoring
      class matches the reference label. The current upstream classifier uses accuracy
      and cross-entropy; predictions and a run-level evaluation report were not supplied
      with the model repository, so this result has not been reproduced here.

      The inspected dataset revision has 1,368 rows marked test. Its valid and test
      subsets share 232 distinct, identical SA strings. Comparing only their amino-acid
      components gives 233 valid/test overlaps and one train/test overlap; train/test
      SA-string overlap is zero. Counts are intersections of unique strings, not row
      counts. This audit concerns the pinned mirror and does not prove that the original
      scored run used these exact splits. Original split IDs, run/checkpoint provenance
      and per-example predictions are required to assess possible contamination.
    benchmarks:
      - "Ten-class single-label subcellular localization on SaProtHub/Dataset-Subcellular_Localization-DeepLoc; the publisher cites the original 2017 DeepLoc dataset."

