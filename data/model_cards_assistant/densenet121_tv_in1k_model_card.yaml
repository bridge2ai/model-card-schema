considerations:
  users:
    - description: |
        ML researchers and engineers using DenseNet-121 as a baseline for image-classification
        benchmarks, a feature backbone for transfer learning, or a building block in detection
        and segmentation pipelines.

  use_cases:
    - description: "ImageNet-1k image classification baseline"
    - description: "Transfer learning backbone for downstream computer-vision tasks"
    - description: "Feature extraction (forward_features) for use in detection / segmentation"
    - description: "Educational reference implementation of densely-connected architectures"

  limitations:
    - description: |
        Trained on ImageNet-1k only; out-of-distribution performance on non-ImageNet domains
        (medical imaging, satellite imagery, microscopy) is unknown without further fine-tuning.
    - description: |
        The reviewed model card and torchvision metadata provide aggregate accuracy. Per-class,
        demographic, microscopy and CM4AI-specific results are not established by those sources.
    - description: |
        Confidence intervals, repeated-run estimates, calibration results, original training
        hardware, wall time and energy consumption are not established by the reviewed sources.
        No confidence bounds or compute estimates are inferred from rounded aggregate scores.

  tradeoffs:
    - description: |
        Dense connectivity reuses feature maps, but parameter count alone does not predict
        deployment latency or memory consumption. Benchmark the implementation on target hardware.
    - description: |
        For downstream model selection, compare aggregate accuracy with per-class recall and
        worst-subgroup error on relevant, adequately sized evaluation slices. A gain in average
        accuracy can coexist with worse performance for a particular class or subgroup.
        Set acceptance criteria according to the consequences of those errors and report
        sample sizes and uncertainty. This is a recommendation by this card's maintainers;
        no observed disparity or quantified accuracy-versus-fairness tradeoff is claimed here.

  ethical_considerations:
    - name: "Deployment outside the documented benchmark"
      mitigation_strategy: |
        Evaluate error rates and calibration on representative target data and relevant
        subgroups before relying on predictions. Review data rights, privacy and category
        suitability for the intended application. These are recommendations by this card's
        maintainers, not a claim that the original developers performed those audits.

  out_of_scope_uses:
    - description: "Face recognition / identification"
    - description: "Demographic classification (age, gender, ethnicity)"
    - description: "Surveillance applications"
    - description: "Clinical / medical diagnosis without dedicated retraining and regulatory clearance"

usage_documentation:
  installation_instructions: |
    Install a compatible PyTorch/torchvision pair using https://pytorch.org/get-started/locally/,
    then install `timm`, `huggingface_hub`, `safetensors` and `Pillow` in that environment.
    These instructions describe inference dependencies, not the original LuaTorch training
    environment. An exact tested dependency lock has not been established for this card.
  training_configuration: |
    The original authors provide this ImageNet training example in their repository README:
    `th main.lua -netType densenet -dataset imagenet -data [dataFolder] -batchSize 256 -nEpochs 90 -depth 121 -growthRate 32 -nGPU 4 -nThreads 16 -optMemory 3`
    Source: https://github.com/liuzhuang13/DenseNet#usage
    This is a documented reproduction example. In particular, its GPU count and later memory
    optimization options do not establish the hardware or exact command used for the ported weights.
  inference_configuration: |
    The example below loads a fixed Hub revision on CPU and preprocesses a local RGB image
    using that model's timm configuration. It returns five zero-based ImageNet class indices
    and softmax scores. Match indices to the ImageNet-1k category mapping before displaying labels.
    The weights download on first use. This example has not been executed with model weights
    during this documentation review, and its scores are not an evaluation result.
  code_examples:
    - description: "Classify a local image with the pinned Hub model and timm preprocessing"
      code_language: "python"
      code: |
        from PIL import Image
        import torch
        import timm

        revision = "f0d0f2698a02cb133b09d48396db6e1e46fe9f3b"
        model = timm.create_model(
            f"hf-hub:timm/densenet121.tv_in1k@{revision}",
            pretrained=True,
        ).eval()
        data_config = timm.data.resolve_model_data_config(model)
        transform = timm.data.create_transform(**data_config, is_training=False)
        image = Image.open("image.jpg").convert("RGB")
        with torch.inference_mode():
            logits = model(transform(image).unsqueeze(0))
            scores, class_indices = logits.softmax(dim=-1).topk(5, dim=-1)
        print(class_indices[0].tolist(), scores[0].tolist())

bias_model: |
  The cited aggregate benchmark does not establish equitable performance across populations
  or suitability for biomedical images. This card makes no claim that a fairness audit has
  or has not been performed elsewhere; deployment-specific evidence is needed.
bias_output: |
  Predictions rank the fixed ImageNet-1k classes. Softmax scores are not evidence of calibrated
  confidence, and the classifier has no explicit unknown-class output. Calibration and
  out-of-distribution behavior require evaluation on the intended application.
