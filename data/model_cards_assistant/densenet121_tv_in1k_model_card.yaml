model_parameters:
  model_architecture: |
    DenseNet-121 architecture with 4 dense blocks (each with growth rate 32) interleaved with
    transition layers (1x1 conv + 2x2 average pool). Total ~8.0M parameters, ~2.9 GMACs at 224x224.
    Final 1000-way classifier head trained on ImageNet-1k.

  data:
    - name: "ImageNet-1k (ILSVRC2012)"
      link: "https://www.image-net.org/"
      description: |
        The ILSVRC2012 organizers describe approximately 1.2 million training images and
        50,000 labeled validation images across 1000 object categories. Training and validation
        are distinct benchmark splits; the listed accuracy results use validation, not the
        hidden-label challenge test set. The dataset is obtained separately from the weights.
        Source: https://image-net.org/challenges/LSVRC/2012/index.php
      bias_input: |
        The training label space is restricted to ImageNet-1k object categories. Aggregate
        ImageNet accuracy does not establish coverage of a deployment population or microscopy
        domain; an application-specific dataset audit and evaluation are still needed.

  training_procedure:
    description: |
      Supervised ImageNet-1k classification. Torchvision identifies the supplied weights as a
      LuaTorch port (https://github.com/pytorch/vision/pull/116); timm redistributes them.
      A current torchvision reference training script is not evidence of this checkpoint's run.
    methodology: |
      The original paper's ImageNet recipe uses SGD with Nesterov momentum 0.9, weight decay
      1e-4, batch size 256 and 90 epochs. Initial learning rate 0.1 is reduced tenfold at
      epochs 30 and 60 (https://arxiv.org/html/1608.06993v5#S4.SS2).
      These are paper-level settings, not a recovered run manifest for the Hub artifact.
      Exact seed, software versions, checkpoint selection and run-specific configuration
      remain unverified; numeric hyperparameter fields are therefore left unset.
    reproducibility_info:
      pipeline_url: "https://github.com/liuzhuang13/DenseNet"
    training_data_separate: true

  input_format: "RGB images; timm config specifies bicubic resize, center crop to 224x224, and ImageNet normalization"
  input_format_map:
    - key: "shape"
      value: "[B, 3, 224, 224]"
    - key: "dtype"
      value: "float32"
    - key: "normalization"
      value: "mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]"
    - key: "preprocessing"
      value: "timm Hub config: bicubic interpolation, crop_pct=0.875, center crop; use resolve_model_data_config/create_transform"
  output_format: "1000-way classification logits"
  output_format_map:
    - key: "shape"
      value: "[B, 1000]"
    - key: "interpretation"
      value: "raw logits over ImageNet-1k classes; apply softmax for probabilities"

