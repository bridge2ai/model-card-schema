schema_version: "0.0.2"

model_details:
  name: "DenseNet-121 (timm/densenet121.tv_in1k)"
  short_description: "DenseNet image classification model trained on ImageNet-1k (original torchvision weights, distributed via timm)."
  overview: |
    DenseNet-121 (Huang et al., CVPR 2017) concatenates earlier feature maps within each dense block.
    This card covers the public ImageNet-1k checkpoint `timm/densenet121.tv_in1k`.
    Its upstream card identifies original torchvision weights; torchvision records that these were
    ported from LuaTorch. The timm distribution provides image classification and feature extraction.
    The relationship between this public checkpoint and any CM4AI-specific trained model has not
    been established by the sources cited here.
  documentation: |
    ## Model Architecture
    - Backbone: DenseNet-121 with four dense blocks
    - Growth rate: 32 (feature maps added per layer)
    - Total parameters: ~8.0M
    - Compute: 2.9 GMACs at 224x224
    - Activations: 6.9M
    - Input resolution: 224 x 224

    ## Distribution and provenance
    The [Hub file tree](https://huggingface.co/timm/densenet121.tv_in1k/tree/f0d0f2698a02cb133b09d48396db6e1e46fe9f3b)
    distributes `model.safetensors`, a PyTorch state dictionary in `pytorch_model.bin`, and `config.json`.
    The revision identifies the inspected repository snapshot, not a new training run.

    ## License scope
    The [upstream model-card metadata](https://huggingface.co/timm/densenet121.tv_in1k/blob/f0d0f2698a02cb133b09d48396db6e1e46fe9f3b/README.md)
    declares Apache-2.0 for this Hub distribution. This is the distributor's declaration.
    Torchvision source is BSD-3-Clause; the timm DenseNet implementation retains that attribution.
    A library's code license alone does not establish the rights to every training image or checkpoint.

    ## Usage
    See usage_documentation for installation, preprocessing and complete inference code.
    Feature extraction is available through `forward_features` and `forward_head`.

    ## Citation
    See model_details.citations and model_details.references.
